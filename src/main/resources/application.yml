spring:
  application:
    name: Notification Platform
  datasource:
    url: jdbc:postgresql://localhost:5432/np_db_local
    username: postgres
    password: PgSup13!
  jpa:
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: kafka:9092
    consumer:
      group-id: notification-consumer
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: com.example.notificationplatform.event
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    template:
      default-topic: notification-events
      dlq-topic: notification-events-dlq
  http:
    client:
      connect-timeout: 5s
      read-timeout: 5s
notification:
  email:
    failure-rate: 0.2
  webhook:
    max-attempts: 5
    initial-delay-ms: 1000
    multiplier: 2